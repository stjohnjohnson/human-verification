  :root { --ink:#a1efb8; --bright:#c4ffd3; --dim:#719c7c; --line:#31513a; --black:#07110b; font-family:"Special Elite","Courier New",Courier,monospace; color:var(--ink); background:#080c09; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100svh; display:grid; place-items:center; padding:40px 24px; background:radial-gradient(ellipse at 50% 45%,#18231a 0,#0d130f 48%,#080b09 100%); }
  button,input { font:inherit; }
  button { cursor:pointer; }
  button:focus-visible { outline:2px solid var(--bright); outline-offset:7px; }
  .housing { width:min(1120px,100%); padding:21px; background:linear-gradient(135deg,#232c24,#131b15 55%,#202821); border:1px solid #394138; border-radius:25px; box-shadow:inset 0 1px 1px #4b5344,0 30px 100px #0009,0 2px 5px #000b; position:relative; }
  .housing::before,.housing::after { content:""; position:absolute; width:5px; height:5px; border-radius:50%; background:#0b100c; box-shadow:inset 0 1px 1px #000,0 1px #505345; bottom:9px; }
  .housing::before { left:20px; } .housing::after { right:20px; }
  .screen { position:relative; isolation:isolate; overflow:hidden; border:1px solid #0a0d09; border-radius:12px; background:radial-gradient(ellipse at 50% 40%,#102618 0,#09180f 62%,#07110b 100%); box-shadow:inset 0 0 55px #000b,0 1px #44513e; padding:58px 64px 48px; min-height:685px; }
  .screen::after { content:""; position:absolute; inset:0; z-index:5; pointer-events:none; background:repeating-linear-gradient(transparent 0px,transparent 2px,#00000018 3px,#00000018 4px); opacity:.55; }
  .agency { display:flex; align-items:center; justify-content:center; gap:21px; margin:0 auto 79px; }
  .seal { flex:none; width:51px; height:61px; color:var(--dim); }
  .agency h1 { font-size:14px; line-height:1.65; letter-spacing:.13em; font-weight:400; margin:0; max-width:490px; text-shadow:0 0 10px #8aff9e22; }
  .hint { text-align:center; color:var(--ink); font-size:16px; line-height:1.6; margin:0 0 29px; }
  .entry { max-width:760px; margin:0 auto; }
  .code-groups { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:24px; margin-bottom:37px; }
  .code-input { font-family:"IBM Plex Mono",monospace; font-style:normal; width:100%; min-width:0; padding:19px 0 18px .13em; border:1px solid var(--line); border-bottom:2px solid #6d9876; border-radius:2px; background:#07120ba6; color:var(--bright); font-size:clamp(32px,5.3vw,72px); font-weight:400; line-height:1.15; text-align:center; letter-spacing:.13em; text-shadow:0 0 18px #8fff9c30; outline:none; caret-color:var(--bright); transition:border-color .15s,box-shadow .15s; }
  .code-input::placeholder { color:#63836b; opacity:1; text-shadow:none; }
  .code-input:focus { border-color:var(--ink); box-shadow:0 0 0 3px #b2ffca0c,inset 0 0 30px #7dff9c06; }
  .code-input:disabled { opacity:.65; }
  .verify { width:100%; min-height:86px; display:flex; align-items:center; justify-content:center; gap:20px; border:1px solid #abd6b2; border-radius:2px; background:#a1e8b4; color:#0b2112; font-size:clamp(18px,2.6vw,28px); line-height:1.25; font-weight:400; letter-spacing:.09em; text-transform:uppercase; box-shadow:0 0 24px #7bffa010,inset 0 0 0 3px #0b211210; transition:background .15s,box-shadow .15s; }
  .verify::before { content:">"; font-weight:normal; }
  .verify:not(:disabled):hover { background:#c1ffd0; box-shadow:0 0 30px #7bffa025; }
  .verify:disabled { cursor:default; color:#95c7a2; background:#1c3926; border-color:#42634a; box-shadow:none; }
  .verify.processing { gap:0; }
  .verify.processing::before { display:none; }
  .verify.processing::after { content:"..."; display:inline-block; width:3ch; text-align:left; animation:ellipsis 1.5s steps(1,end) infinite; }
  .feedback { min-height:54px; padding-top:23px; margin:0; font-size:14px; line-height:1.6; color:var(--dim); text-align:center; }
  .feedback.error { color:#e3c192; }
  .progress { height:2px; background:#1e3927; margin-top:17px; overflow:hidden; }
  .progress span { display:block; height:100%; background:var(--ink); transform-origin:left; animation:progress 4s linear forwards; }
  .result { text-align:center; margin:-25px auto 0; }
  .result-label { font-size:12px; color:var(--dim); letter-spacing:.2em; margin:0 0 22px; }
  .phrase { font-size:clamp(34px,5.8vw,70px); line-height:1.13; letter-spacing:.08em; font-weight:normal; margin:0 0 27px; color:var(--bright); text-shadow:0 0 23px #8fff9c25; outline:none; overflow-wrap:anywhere; }
  .phrase span { display:block; }
  .result-instruction { margin:0; color:var(--ink); font-size:15px; line-height:1.6; }
  .return { color:var(--dim); background:none; border:none; border-bottom:1px solid #385440; padding:4px 0; margin-top:28px; font-size:12px; }
  .return:hover { color:var(--bright); }
  @keyframes ellipsis { 0%,100% { content:"."; } 33.333% { content:".."; } 66.666% { content:"..."; } }
  @keyframes progress { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @media (min-width:1600px) { .housing { width:1240px; } .screen { min-height:760px; padding-top:70px; } .agency { margin-bottom:92px; } }
  @media (max-width:700px) {
    body { padding:20px 12px; } .housing { padding:12px; border-radius:19px; }
    .screen { min-height:600px; padding:43px 24px 30px; }
    .agency { gap:13px; margin-bottom:65px; } .seal { width:35px; height:45px; }
    .agency h1 { font-size:10px; letter-spacing:.075em; }
    .hint { font-size:14px; } .code-groups { gap:12px; margin-bottom:28px; }
    .code-input { font-size:clamp(23px,5.7vw,40px); padding-top:17px; padding-bottom:17px; }
    .verify { min-height:76px; gap:12px; letter-spacing:.055em; }
    .feedback { font-size:12px; } .result { margin:0; } .phrase { font-size:clamp(30px,7.5vw,50px); }
  }
  @media (max-width:380px) { .screen { padding-left:16px; padding-right:16px; } .agency { gap:9px; } .agency h1 { font-size:9px; } .code-groups { gap:8px; } }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } .progress span { transform:scaleX(1); } }
</style>
</head>

<main class="housing" aria-label="Human verification terminal">
  <div class="screen">
    <header class="agency">
      <svg class="seal" viewBox="0 0 60 70" fill="none" aria-hidden="true">
        <path d="M30 3 55 13v21c0 15-11 26-25 33C16 60 5 49 5 34V13Z" stroke="currentColor"/>
        <path d="m30 9 19 8v17c0 11-8 21-19 27C19 55 11 45 11 34V17Z" stroke="currentColor" opacity=".5"/>
        <circle cx="30" cy="32" r="12" stroke="currentColor"/>
        <circle cx="30" cy="32" r="5" stroke="currentColor"/>
        <path d="M30 16v7m0 18v7M14 32h7m18 0h7M23 52h14" stroke="currentColor"/>
      </svg>
      <h1>DEPARTMENT FOR AUTHENTICATION,<br>VERIFICATION &amp; IDENTITY DETERMINATION</h1>
    </header>
    <section id="entry" class="entry">
      <p id="code-hint" class="hint">Enter your final twelve-character validation code.</p>
      <form id="verification-form" autocomplete="off" novalidate>

function sha256(text) {
  const bytes = Array.from(new TextEncoder().encode(text));

  const h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const rotate = (x,n) => (x>>>n)|(x<<(32-n));
  for (let offset=0;offset<bytes.length;offset+=64) {
    const w = new Array(64);
    for (let i=0;i<16;i++) { const p=offset+i*4;w[i]=((bytes[p]<<24)|(bytes[p+1]<<16)|(bytes[p+2]<<8)|bytes[p+3])>>>0; }

      const x=w[i-15], y=w[i-2];

    let [a,b,c,d,e,f,g,j] = h;

      const t2=((rotate(a,2)^rotate(a,13)^rotate(a,22))+((a&b)^(a&c)^(b&c)))>>>0;
      j=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }

function verifyCode(code) {
  if (!/^[A-Z0-9]{12}$/.test(code)) return {accepted:false};
  if (sha256(NAMESPACE+':'+code)[0] !== 0) return {accepted:false};
  const digest = sha256('phrase:'+NAMESPACE+':'+code);
  const phrase = [0,4,8].map(i=> {
    const value = digest[i]*16777216 + digest[i+1]*65536 + digest[i+2]*256 + digest[i+3];
    return WORDS[value % WORDS.length].toUpperCase();
  });
  return {accepted:true,phrase};
}

<script>
(() => {
  'use strict';
  const fields = Array.from(document.querySelectorAll('.code-input'));
  const form = document.getElementById('verification-form');
  const button = document.getElementById('verify-button');
  const feedback = document.getElementById('feedback');
  const progress = document.getElementById('progress');
  const entry = document.getElementById('entry');
  const result = document.getElementById('result');
  const phrase = document.getElementById('phrase');
  const messages = [
    'Confirming you have waved at someone waving behind you…',
    'Cross-referencing embarrassing memories…',
    'Confirming you have forgotten why you came in…',
    'Checking whether you have tried pushing a pull door…',
    'Checking whether this check has already been checked…',
    'Checking whether another form would help…'
  ];
  let busy = false;
  let previousMessage = -1;
  const clean = text => text.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const value = () => fields.map(field=>field.value).join('');
  function update() {
    button.disabled = busy || value().length !== 12;
    feedback.textContent = '';
    feedback.classList.remove('error');
  }
  fields.forEach((field,index)=> {
    field.addEventListener('input',()=> {
      const selection = field.selectionStart;
      const raw = field.value;
      field.value = clean(raw).slice(0,3);
      if (field.value.length === 3 && index < fields.length - 1) {
        fields[index+1].focus();fields[index+1].select();
      } else if (selection !== null) {
        const position = clean(raw.slice(0,selection)).length;
        field.setSelectionRange(position,position);
      }
      update();
    });
    field.addEventListener('paste',event=> {
      if (!event.clipboardData) return;
      event.preventDefault();
      const text = clean(event.clipboardData.getData('text'));
      if (!text) return;
      // A complete code pasted into any group replaces the complete entry.
      const start = text.length >= 12 ? 0 : index;
      const remaining = text.slice(0,(fields.length-start)*3);
      for (let i=0;i<Math.ceil(remaining.length/3);i++) fields[start+i].value=remaining.slice(i*3,i*3+3);
      const last = Math.min(fields.length-1,start+Math.floor(remaining.length/3));
      fields[last].focus();fields[last].select();update();
    });
    field.addEventListener('keydown',event=> {
      if (event.key === 'Backspace' && !field.value && index > 0) {
        event.preventDefault();fields[index-1].focus();fields[index-1].setSelectionRange(3,3);
      } else if (event.key === 'ArrowLeft' && field.selectionStart === 0 && field.selectionEnd === 0 && index > 0) {
        event.preventDefault();fields[index-1].focus();fields[index-1].setSelectionRange(3,3);
      } else if (event.key === 'ArrowRight' && field.selectionStart === field.value.length && index < fields.length - 1) {
        event.preventDefault();fields[index+1].focus();fields[index+1].setSelectionRange(0,0);
      }
    });
  });
  form.addEventListener('submit',async event=> {
    event.preventDefault();
    if (busy || value().length !== 12) return;
    busy = true;
    const code = value();
    fields.forEach(field=>field.disabled=true);
    button.disabled=true;button.textContent='Validating';button.setAttribute('aria-label','Validating');button.classList.add('processing');
    form.setAttribute('aria-busy','true');
    feedback.classList.remove('error');
    let message;
    do { message=Math.floor(Math.random()*messages.length); } while (message===previousMessage);
    previousMessage=message;feedback.textContent=messages[message];
    progress.hidden=false;
    await new Promise(resolve=>setTimeout(resolve,4000));
    const outcome = verifyCode(code);
    progress.hidden=true;
    busy=false;fields.forEach(field=>field.disabled=false);
    button.classList.remove('processing');button.textContent='Verify humanity';button.setAttribute('aria-label','Verify humanity');button.disabled=false;
    form.removeAttribute('aria-busy');
    if (outcome.accepted) {
      phrase.replaceChildren(...outcome.phrase.map(word=> {
        const span=document.createElement('span');span.textContent=word;return span;
      }));
      entry.hidden=true;result.hidden=false;phrase.focus();
    } else {
      feedback.classList.add('error');
      feedback.textContent='Humanity could not be established. Please retry.';
      fields[0].focus();fields[0].select();
    }
  });
  document.getElementById('return-button').addEventListener('click',()=> {
    result.hidden=true;entry.hidden=false;fields.forEach(field=>field.value='');
    phrase.replaceChildren();update();fields[0].focus();
  });
})();
</script>
